# FrotaGest · Reis Tecnologia
# Painel em https://__DOMINIO__  (navegador → Cloudflare → Nginx → FrotaGest em 127.0.0.1:__PORTA__)
# Gerado por tools/nginx/instalar-dominio.sh. Os DVRs não passam por aqui: continuam no IP, portas 6608 e 6602.

map $http_upgrade $frotagest_conexao {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;
    include /etc/nginx/snippets/frotagest-cloudflare.conf;
    return 301 https://$host$request_uri;
}

# HTTPS com o certificado de origem da Cloudflare
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMINIO__;

    ssl_certificate     /etc/ssl/cloudflare/frotagest.pem;
    ssl_certificate_key /etc/ssl/cloudflare/frotagest.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens       off;

    # Só a Cloudflare chega ao painel: quem tentar pelo IP direto recebe 403
    include /etc/nginx/snippets/frotagest-cloudflare.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    # Tempo real (eventos e vídeo): conexões longas, sem buffer
    location /ws/ {
        proxy_pass http://127.0.0.1:__PORTA__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $frotagest_conexao;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Painel, API e downloads (sem buffer: o MP4 sai direto, com o progresso no navegador)
    location / {
        proxy_pass http://127.0.0.1:__PORTA__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 5m;
    }
}
